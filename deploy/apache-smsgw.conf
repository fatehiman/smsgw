# smsgw.kimiasoft.ir: Apache in front of the Node app on 127.0.0.1:25464.
# Installed as /etc/apache2/sites-available/smsgw.kimiasoft.ir.conf
#
# Only "/" (the under-construction page, a static file), /api, /mainadmin and /hook reach Node.
# Every other path (wp-admin, .env, ...) is answered with a bare 404 by Apache itself.
# Behind ArvanCDN: mod_remoteip takes the real client IP from AR-Real-IP, but only when the
# connection comes from an Arvan address (list in /etc/apache2/smsgw-arvan-ips.conf, refreshed
# weekly by deploy/update-arvan-ips.sh). Node trusts X-Gw-Client-IP only from loopback.

<Macro SmsgwSite $scheme>
    ServerSignature Off
    DocumentRoot /var/www/smsgw/public
    <Directory /var/www/smsgw/public>
        Require all granted
        Options -Indexes -FollowSymLinks
        AllowOverride None
    </Directory>
    ErrorDocument 404 "Not Found"
    ErrorDocument 403 "Not Found"
    LimitRequestBody 262144

    RemoteIPHeader AR-Real-IP
    Include /etc/apache2/smsgw-arvan-ips.conf

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader unset X-Gw-Client-IP
    RequestHeader unset X-Gw-Scheme
    RequestHeader set X-Gw-Client-IP "expr=%{REMOTE_ADDR}"
    RequestHeader set X-Gw-Scheme $scheme
    ProxyPass        /api       http://127.0.0.1:25464/api
    ProxyPass        /mainadmin http://127.0.0.1:25464/mainadmin
    ProxyPass        /hook      http://127.0.0.1:25464/hook
    ProxyPassReverse /mainadmin http://127.0.0.1:25464/mainadmin
</Macro>

<VirtualHost *:80>
    ServerName smsgw.kimiasoft.ir
    Use SmsgwSite http
    ErrorLog  ${APACHE_LOG_DIR}/smsgw-error.log
    CustomLog ${APACHE_LOG_DIR}/smsgw-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName smsgw.kimiasoft.ir
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/smsgw.kimiasoft.ir.crt
    SSLCertificateKeyFile /etc/ssl/private/smsgw.kimiasoft.ir.key
    Use SmsgwSite https
    ErrorLog  ${APACHE_LOG_DIR}/smsgw-error.log
    CustomLog ${APACHE_LOG_DIR}/smsgw-ssl-access.log combined
</VirtualHost>

UndefMacro SmsgwSite
